<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%" fill="none">
  <defs>
    <!-- Clip path for horizontal wood slats on circle -->
    <clipPath id="circleClip">
      <circle cx="280" cy="275" r="185" />
    </clipPath>
    <!-- Drop shadow filter -->
    <filter id="teaShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0C4A34" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Accent Dashes Radiating -->
  <g stroke="#00BFA5" stroke-width="5" stroke-linecap="round">
    <path d="M 85 320 Q 95 310 100 295" />
    <path d="M 75 350 Q 82 340 90 330" />
    <path d="M 70 380 Q 75 370 82 360" />
    <path d="M 460 260 Q 470 270 478 285" />
    <path d="M 470 290 Q 478 300 482 315" />
    <path d="M 450 320 Q 456 330 460 345" />
  </g>

  <!-- Terracotta / Wood Slat Medallion -->
  <g filter="url(#teaShadow)">
    <circle cx="280" cy="275" r="185" fill="#E27344" stroke="#1A1A1A" stroke-width="5" />
    <!-- Horizontal Slats -->
    <g clip-path="url(#circleClip)" stroke="#1A1A1A" stroke-width="4">
      <line x1="70" y1="130" x2="490" y2="130" />
      <line x1="70" y1="165" x2="490" y2="165" />
      <line x1="70" y1="200" x2="490" y2="200" />
      <line x1="70" y1="235" x2="490" y2="235" />
      <line x1="70" y1="270" x2="490" y2="270" />
      <line x1="70" y1="305" x2="490" y2="305" />
      <line x1="70" y1="340" x2="490" y2="340" />
      <line x1="70" y1="375" x2="490" y2="375" />
      <line x1="70" y1="410" x2="490" y2="410" />
    </g>
  </g>

  <!-- Tilted Artisan Teapot -->
  <g transform="rotate(-28 340 220)">
    <!-- Handle -->
    <path d="M 410 170 C 470 170 475 250 415 275" fill="#C85A2D" stroke="#1A1A1A" stroke-width="5" />
    <path d="M 405 190 C 445 190 445 235 405 255" fill="#E27344" stroke="#1A1A1A" stroke-width="4" />

    <!-- Teapot Body -->
    <path d="M 240 160 C 240 160 250 270 340 280 C 410 280 420 220 420 160 Z" fill="#E89B6C" stroke="#1A1A1A" stroke-width="5" />
    <!-- Body stripes -->
    <g stroke="#1A1A1A" stroke-width="3">
      <line x1="260" y1="170" x2="265" y2="250" />
      <line x1="280" y1="165" x2="288" y2="265" />
      <line x1="300" y1="162" x2="310" y2="272" />
      <line x1="320" y1="160" x2="330" y2="278" />
      <line x1="340" y1="160" x2="350" y2="278" />
      <line x1="360" y1="162" x2="370" y2="272" />
      <line x1="380" y1="165" x2="388" y2="260" />
      <line x1="400" y1="170" x2="405" y2="240" />
    </g>

    <!-- Spout with dots -->
    <path d="M 245 210 C 200 230 170 200 160 215 C 150 230 180 275 255 265 Z" fill="#D26335" stroke="#1A1A1A" stroke-width="5" />
    <circle cx="178" cy="228" r="3" fill="#FFE8D6" />
    <circle cx="192" cy="236" r="3" fill="#FFE8D6" />
    <circle cx="206" cy="245" r="3" fill="#FFE8D6" />
    <circle cx="190" cy="222" r="2.5" fill="#FFE8D6" />
    <circle cx="208" cy="230" r="2.5" fill="#FFE8D6" />
    <circle cx="225" cy="240" r="2.5" fill="#FFE8D6" />

    <!-- Teapot Lid with stripes & finial -->
    <ellipse cx="330" cy="160" rx="90" ry="24" fill="#F4E3B2" stroke="#1A1A1A" stroke-width="5" />
    <path d="M 255 155 C 270 120 390 120 405 155 Z" fill="#F4E3B2" stroke="#1A1A1A" stroke-width="5" />
    <g stroke="#1A1A1A" stroke-width="3">
      <line x1="285" y1="150" x2="325" y2="128" />
      <line x1="310" y1="152" x2="328" y2="126" />
      <line x1="330" y1="152" x2="330" y2="125" />
      <line x1="350" y1="152" x2="332" y2="126" />
      <line x1="375" y1="150" x2="335" y2="128" />
    </g>
    <!-- Finial knob -->
    <circle cx="330" cy="122" r="14" fill="#C85A2D" stroke="#1A1A1A" stroke-width="4" />
  </g>

  <!-- Green Tea Splashes & Stream -->
  <g fill="#075E3D" stroke="#1A1A1A" stroke-width="4">
    <!-- Stream entering cup with dynamic curl -->
    <path d="M 210 260 C 220 280 235 300 215 330 C 195 360 210 400 200 420 C 185 410 180 370 195 340 C 205 315 195 285 205 260 Z" />
    <!-- Splash Droplet 1 -->
    <path d="M 240 290 C 275 270 295 310 265 330 C 245 345 225 320 240 290 Z" />
    <!-- Splash Droplet 2 -->
    <circle cx="215" cy="275" r="14" />
    <circle cx="265" cy="305" r="12" />
    <circle cx="165" cy="315" r="9" />
  </g>
  <!-- Splash glossy highlights -->
  <ellipse cx="242" cy="288" rx="8" ry="4" transform="rotate(-30 242 288)" fill="#FFFFFF" />
  <circle cx="212" cy="272" r="4" fill="#FFFFFF" />
  <circle cx="263" cy="302" r="3.5" fill="#FFFFFF" />

  <!-- Artisan Ceramic Teacup -->
  <g>
    <!-- Handle with green stripes -->
    <path d="M 220 375 C 270 375 270 455 220 455" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" />
    <path d="M 220 375 C 270 375 270 455 220 455" fill="none" stroke="#00BFA5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8" />

    <!-- Cup Body -->
    <path d="M 130 350 L 225 365 L 205 470 C 200 485 160 485 150 470 L 130 350 Z" fill="#FDF8EB" stroke="#1A1A1A" stroke-width="5" />
    <!-- Cup Rim & Top Liquid Surface -->
    <ellipse cx="178" cy="358" rx="48" ry="16" fill="#075E3D" stroke="#1A1A1A" stroke-width="5" />
    <ellipse cx="178" cy="358" rx="42" ry="12" fill="#0C4A34" />
    <ellipse cx="165" cy="356" rx="14" ry="4" fill="#14B8A6" opacity="0.6" />

    <!-- Speckles & Collar Dots -->
    <g fill="#1A1A1A">
      <circle cx="148" cy="380" r="3" />
      <circle cx="162" cy="382" r="3" />
      <circle cx="176" cy="384" r="3" />
      <circle cx="190" cy="386" r="3" />
      <circle cx="204" cy="388" r="3" />
      <!-- Base dots -->
      <circle cx="152" cy="455" r="2.5" />
      <circle cx="164" cy="460" r="2.5" />
      <circle cx="176" cy="462" r="2.5" />
      <circle cx="188" cy="460" r="2.5" />
    </g>

    <!-- Tea Tag & Thread -->
    <path d="M 140 365 Q 115 390 120 420" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="4 2" />
    <g transform="translate(100, 410) rotate(-10)">
      <polygon points="0,0 30,0 25,40 5,40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
      <circle cx="15" cy="8" r="2" fill="#1A1A1A" />
      <path d="M 15 16 C 12 24 18 24 15 32" stroke="#00BFA5" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <ellipse cx="15" cy="24" rx="4" ry="2" fill="#00BFA5" />
    </g>
  </g>
</svg>
